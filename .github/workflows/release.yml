name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test -- --run

  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    continue-on-error: true  # optional until APPLE_* secrets exist
    steps:
      - uses: actions/checkout@v4

      - name: Install Apple Certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (signed + notarized)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  build-macos-intel:
    runs-on: macos-14  # Cross-compile to Intel
    continue-on-error: true  # optional until APPLE_* secrets exist
    steps:
      - uses: actions/checkout@v4

      - name: Install Apple Certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Intel, signed + notarized)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true  # optional; unsigned without keystore secrets
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android signing keystore (Release tags)
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            echo "Decoding Android keystore from secret..."
            echo -n "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/myjavis-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/myjavis-release.jks" >> $GITHUB_ENV
          else
            echo "ANDROID_SIGNING_KEY not set; building unsigned release (will still produce APK)."
          fi

      - name: Build Android (APK)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            src-tauri/gen/android/**/outputs/**/*.apk
            src-tauri/gen/android/**/outputs/**/*.aab

  release:
    needs: [build-windows, build-macos, build-macos-intel, build-android]
    # Optional platform jobs may fail (missing signing secrets); a release is
    # still cut as long as Windows — the primary target — succeeded.
    if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-build
          path: artifacts/macos

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-intel-build
          path: artifacts/macos-intel

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-build
          path: artifacts/android

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Rename macOS artifacts to include arch
        run: |
          # Rename aarch64 tar.gz to include arch
          for f in artifacts/macos/macos/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz}_aarch64.app.tar.gz"
          done
          for f in artifacts/macos/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz.sig}_aarch64.app.tar.gz.sig"
          done
          # Rename x86_64 tar.gz to include arch
          for f in artifacts/macos-intel/macos/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz}_x64.app.tar.gz"
          done
          for f in artifacts/macos-intel/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "${f%.app.tar.gz.sig}_x64.app.tar.gz.sig"
          done
          echo "Renamed artifacts:"
          find artifacts -name "*.tar.gz*" -type f

      - name: Generate latest.json for updater
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="https://github.com/dainn-dev/assistant/releases/download/v${VERSION}"

          # A platform only enters latest.json when both its artifact and its
          # signature exist — unsigned or skipped builds are omitted entirely.
          PLATFORMS=""
          add_platform() {
            local key="$1" file="$2" sig="$3"
            if [ -n "$file" ] && [ -n "$sig" ]; then
              [ -n "$PLATFORMS" ] && PLATFORMS="${PLATFORMS},"
              PLATFORMS="${PLATFORMS}
              \"${key}\": { \"signature\": \"${sig}\", \"url\": \"${REPO}/${file}\" }"
            fi
          }

          f=$(ls artifacts/macos/macos/*_aarch64.app.tar.gz 2>/dev/null | head -1 || true)
          s=$(cat artifacts/macos/macos/*_aarch64.app.tar.gz.sig 2>/dev/null | tr -d '[:space:]' || true)
          add_platform "darwin-aarch64" "$(basename "$f" 2>/dev/null)" "$s"

          f=$(ls artifacts/macos-intel/macos/*_x64.app.tar.gz 2>/dev/null | head -1 || true)
          s=$(cat artifacts/macos-intel/macos/*_x64.app.tar.gz.sig 2>/dev/null | tr -d '[:space:]' || true)
          add_platform "darwin-x86_64" "$(basename "$f" 2>/dev/null)" "$s"

          f=$(ls artifacts/windows/nsis/*.exe 2>/dev/null | head -1 || true)
          s=$(cat artifacts/windows/nsis/*.exe.sig 2>/dev/null | tr -d '[:space:]' || true)
          add_platform "windows-x86_64" "$(basename "$f" 2>/dev/null)" "$s"

          if [ -z "$PLATFORMS" ]; then
            echo "No signed updater artifacts were produced — refusing to write an empty latest.json."
            exit 1
          fi

          cat > artifacts/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/dainn-dev/assistant/releases/tag/v${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {${PLATFORMS}
            }
          }
          EOF

          echo "Generated latest.json:"
          cat artifacts/latest.json
          node -e "JSON.parse(require('fs').readFileSync('artifacts/latest.json','utf8'))" 2>/dev/null \
            || python -c "import json;json.load(open('artifacts/latest.json'))"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.app.tar.gz
            artifacts/android/**/*.apk
            artifacts/android/**/*.aab
            artifacts/**/*.sig
            artifacts/latest.json
