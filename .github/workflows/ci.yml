name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check frontend modules
        shell: bash
        run: |
          set -e
          for f in src/js/*.js; do
            node --check "$f"
          done
      - run: npm test

  # windows-latest + macos-latest cover both cfg trees (WASAPI vs
  # ScreenCaptureKit/cpal) — this is how the macOS-gated code gets
  # compile-checked without a local Mac.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
